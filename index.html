</head>

<main class="app-layout">

    <!-- 2. Левая панель (Controls) -->
  <aside class="panel controls-panel">
    <h2>Controls</h2>
    <div class="control-options">
      <!-- БЛЮР-->
      <div  id="blur-section" class="accordion blur">
        <button id="toggle-blur" class="section-name">Blur</button>
        <div class="section-content">
          <label for="blur-bg">Background blur:</label><br>
          <input type="range" id="blur-bg" min="0" max="50" value="10" step="1">
          <span id="value-bg-blur">10px</span>

          <label for="opacity-bg">Background opacity:</label><br>
          <input type="range" id="opacity-bg" min="0" max="1" value="0.2" step="0.01">
          <span id="value-bg-opacity">0.2</span>
        </div>
        </div>
         <!-- RGB -->
        <div id="color-section" class="accordion color">
        <button id="toggle-color" class="section-name">Color</button>
        <div class="section-content">
           <!-- Красный -->
          <label for="red">Red:</label><br>
          <input type="range" id="red" min="0" max="255" value="225" step="1">
          <span id="value-color-r">225</span><br>
           <!-- Зелёный -->
          <label for="green">Green:</label><br>
          <input type="range" id="green" min="0" max="255" value="225" step="1">
          <span id="value-color-g">225</span><br>
           <!-- Синий -->
          <label for="blue">Blue:</label><br>
          <input type="range" id="blue" min="0" max="255" value="225" step="1">
          <span id="value-color-b">225</span>
        </div>
        </div>
         <!-- ТЕНИ -->
        <div id="shadow-section" class="accordion shadow">
        <button id="toggle-shadow" class="section-name">Shadow</button>
        <div class="section-content">
           <!-- Позиция X -->
          <label for="x-pos">X</label><br>
          <input type="range" id="x-pos" min="-50" max="50" value="0" step="1">
          <span id="value-pos-x">0px</span><br>
           <!-- Позиция Y -->
          <label for="y-pos">Y</label><br>
          <input type="range" id="y-pos" min="-50" max="50" value="0" step="1">
          <span id="value-pos-y">0px</span><br>
           <!-- блюр -->
          <label for="shadow-blur">Shadow blur</label><br>
          <input type="range" id="shadow-blur" min="0" max="50" value="15" step="1">
          <span id="value-shadow-blur">0px</span><br>
           <!-- Альфа -->
          <label for="shadow-opacity">Shadow opacity</label><br>
          <input type="range" id="shadow-opacity" min="0" max="1" value="0.2" step="0.01">
          <span id="value-shadow-opacity">0.2</span><br>
           <!-- Расстяжение -->
          <label for="shadow-spread">Shadow spread</label><br>
          <input type="range" id="shadow-spread" min="-20" max="20" value="0" step="1">
          <span id="value-shadow-spread">0px</span><br>
           <!-- RGB #2 -->
           <!-- Красный -->
          <label for="red-shdw">Red:</label><br>
          <input type="range" id="red-shdw" min="0" max="255" value="225" step="1">
          <span id="value-color-r-shdw">225</span><br>
           <!-- Зелёный -->
          <label for="green-shdw">Green:</label><br>
          <input type="range" id="green-shdw" min="0" max="255" value="225" step="1">
          <span id="value-color-g-shdw">225</span><br>
           <!-- Синий -->
          <label for="blue-shdw">Blue:</label><br>
          <input type="range" id="blue-shdw" min="0" max="255" value="225" step="1">
          <span id="value-color-b-shdw">225</span><br>
           <!-- inert -->
          <label for="shadow-inset">Inset</label>
          <input type="checkbox" id="shadow-inset">
        </div>
      </div>
    </div> 
  </aside>

  <!-- 3. Центр верх (Preview) -->
  <section class="panel preview-panel">
    <h2>Central Preview</h2>
    <div class="preview-area">
    <div id="box"></div>
    </div>
  </section>

  <!-- 4. Центр низ (Generated Code) -->
  <section class="panel code-panel">
    <h2>Generated CSS Code</h2>
      <pre><code id="code-output"></code></pre>
  </section>

  <!-- 5. Правая панель (Presets) -->
  <aside class="panel presets-panel">
    <h2>Quick Presets</h2>
  </aside>
</main>
<footer>

</body>
</html>
